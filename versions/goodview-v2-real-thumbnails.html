<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoodView v2 – Real thumbnails</title>
<style>
:root{--bg:#f7f4ec;--card:#fff;--ink:#1f2433;--mute:#6b7080;--line:#e4dfd2;--navy:#26324f;--red:#b03a2a;--redsoft:#f6dcd6;--green:#3f5f4a;--greensoft:#e3ece5;--guest:#e6e9ef;
--serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#171a22;--card:#20242f;--ink:#eceef3;--mute:#9aa0b0;--line:#323746;--navy:#2c3a5c;--redsoft:#4a2a26;--greensoft:#243329;--guest:#262b38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.2}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;max-width:1080px;margin:0 auto;padding:14px 20px 4px}
.logo{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit}
.logo i{width:30px;height:30px;border-radius:7px;background:var(--red);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.logo b{font:700 17px var(--serif);display:block;line-height:1}.logo small{font-size:9px;color:var(--mute);letter-spacing:.04em}
.search{width:300px;max-width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.signin{justify-self:end}
nav{display:flex;justify-content:center;gap:6px;padding:8px 0 14px;max-width:1080px;margin:0 auto}
nav a{padding:6px 14px;border-radius:8px;text-decoration:none;color:var(--mute);font-size:14px;border:1px solid transparent}
nav a.on{background:var(--redsoft);color:var(--red);border-color:var(--red)}
main{max-width:1080px;margin:0 auto;padding:0 20px 56px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:28px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.hero p{margin:12px 0 0;color:#c9d0e2;max-width:46ch}.hero h1{font-size:34px;max-width:14ch}
.hero .kicker{font-size:12px;color:#c9d0e2;margin-bottom:10px}
.pick{background:#fff;color:#1f2433;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.pick .th{min-height:110px}.pick div:last-child{padding:14px;align-self:center}.pick small{display:block;color:#6b7080}
.guest{display:flex;align-items:center;gap:12px;background:var(--guest);border-radius:10px;padding:12px 16px;margin:18px 0}
.guest .av{width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.guest p{margin:0;flex:1;font-size:13px;color:var(--mute)}.guest p b{display:block;color:var(--ink);font-size:14px}
section{margin-top:30px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
.sh h2{font-size:24px}.sh p{margin:2px 0 0;color:var(--mute);font-size:13px}
.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ch{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left}
.ch small{display:block;color:var(--mute);font-size:12px}
.badge{width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.vc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;display:block;width:100%}
.vc:hover h3{text-decoration:underline}
.th{position:relative;aspect-ratio:16/9;background:var(--g)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:#222;font-size:16px}
.th .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px}
.vc .body{padding:12px 14px}.vc h3{font:600 14px var(--sans)}.vc small{display:block;color:var(--mute);font-size:12px}
.end{background:var(--guest);border-radius:10px;padding:26px;text-align:center}
.end h3{font-size:17px}.end p{color:var(--mute);margin:4px 0 14px;font-size:13px}
.watch{display:grid;grid-template-columns:1fr 290px;gap:20px;margin-top:6px}
.crumbs{font-size:13px;color:var(--mute);display:flex;gap:12px;align-items:center;margin:4px 0 14px}
.player{border-radius:12px;overflow:hidden;position:relative;aspect-ratio:16/9;background:var(--g)}
.player .play{width:64px;height:64px;font-size:22px}
.ctrl{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:12px}
.bar{height:4px;background:rgba(255,255,255,.35);border-radius:2px;margin-bottom:8px}.bar i{display:block;height:100%;width:26%;background:#e5533d;border-radius:2px}
.tag{display:inline-block;margin:16px 0 6px;background:var(--redsoft);color:var(--red);font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.watch h1{font-size:28px}.by{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:13px}.by span{flex:1}.by small{color:var(--mute);display:block}
.side>*+*{margin-top:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:13px}.toggle small{color:var(--mute);display:block;font-size:12px}
.sw{width:38px;height:22px;border-radius:11px;border:0;background:var(--line);position:relative}.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-pressed=true]{background:var(--green)}.sw[aria-pressed=true]::after{left:19px}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:6px;color:var(--mute);font-size:13px}.tabs .on{background:var(--redsoft);color:var(--red)}
.lib{display:grid;grid-template-columns:1fr 290px;gap:24px;margin-top:18px}
.day{font:600 12px var(--sans);color:var(--mute);margin:18px 0 8px}
.row{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.row .th{width:96px;aspect-ratio:16/10;border-radius:6px;flex:none;cursor:pointer}.row .th .play{display:none}
.row .info{flex:1;font-size:14px;font-weight:600;font-family:var(--sans)}.row small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.sub{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.sub .t{flex:1;font-size:13px;font-weight:600}.sub small{display:block;color:var(--mute);font-weight:400}
.pill{background:var(--greensoft);color:var(--green);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;margin-right:6px}
.note{background:var(--guest);border-radius:10px;padding:12px;font-size:12px;color:var(--mute)}
.empty{padding:30px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
@media(max-width:820px){header{grid-template-columns:1fr auto}.search{display:none}.hero,.watch,.lib{grid-template-columns:1fr}.channels{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.hero h1{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/"><i>▶</i><span><b>GoodView</b><small>WATCH AT YOUR PACE</small></span></a>
  <input class="search" id="q" type="search" placeholder="Search videos" aria-label="Search videos">
  <button class="btn red signin" id="signin">Sign in</button>
</header>
<nav aria-label="Main"><a href="#/" data-r="home">Home</a><a href="#/watch/1" data-r="watch">Watch</a><a href="#/library" data-r="library">Library</a></nav>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- DATA (edit freely; swap `img` for real thumbnails later) ---------- */
const CH={HG:{n:"Home & Garden",d:"Practical projects",c:"#3f5f4a",i:"HG"},PH:{n:"Past & Present",d:"Stories from history",c:"#8a5a3c",i:"PH"},TK:{n:"The Kind Kitchen",d:"Reliable recipes",c:"#b03a2a",i:"TK"},ST:{n:"Slow Travel",d:"Thoughtful journeys",c:"#2f4f6b",i:"ST"}};
const V=[
 {id:1,img:"../images/tomatoes.jpg",baked:1,t:"The simple way to grow better tomatoes",ch:"HG",dur:"12:18",meta:"18K views · Added yesterday",g:"linear-gradient(135deg,#5f8a4f,#d9b36a)",by:"Gardener Michael Reed shares his dependable routine for healthier tomato plants—from choosing a sunny position to watering slowly and spotting the right time to feast."},
 {id:2,img:"../images/coast.jpg",baked:1,t:"Britain's most beautiful coastal railway",ch:"ST",dur:"18:42",meta:"42K views · Added 3 days ago",g:"linear-gradient(135deg,#3b7a9a,#c9b48a)",by:"A slow ride along cliffs and coves, with stops worth getting off the train for."},
 {id:3,img:"../images/bread.jpg",t:"No-knead bread: a dependable weekend loaf",ch:"TK",dur:"10:06",meta:"31K views · Added 5 days ago",g:"linear-gradient(135deg,#a67c52,#e8d3ae)",by:"Four ingredients, almost no effort, and a crackling crust."},
 {id:4,img:"../images/jazz.jpg",baked:1,t:"The songs that changed jazz forever",ch:"PH",dur:"22:15",meta:"28K views · Added 1 week ago",g:"linear-gradient(135deg,#2a2f3f,#c58a3c)",by:"Six recordings, and the stories behind how each one rewrote the rules."},
 {id:5,img:"../images/roses.jpg",baked:1,t:"Pruning roses without the guesswork",ch:"HG",dur:"8:34",meta:"Home & Garden · 8:34",g:"linear-gradient(135deg,#8aa86a,#e9c9c0)",by:"When, where and how much to cut."},
 {id:6,img:"../images/herbs.jpg",baked:1,t:"Five herbs that thrive on a windowsill",ch:"TK",dur:"11:02",meta:"The Kind Kitchen · 11:02",g:"linear-gradient(135deg,#6f9a5c,#e8e2c4)",by:"Small pots, big flavour."},
 {id:7,img:"../images/soil.jpg",baked:1,t:"Better soil in three simple steps",ch:"HG",dur:"13:40",meta:"Home & Garden · 13:40",g:"linear-gradient(135deg,#6b4f3a,#a7b87a)",by:"Feed the ground and the garden follows."},
 {id:8,img:"../images/photos.jpg",t:"How to organize old family photographs",ch:"PH",dur:"16:30",meta:"Keep & Remember · 12 minutes left",g:"linear-gradient(135deg,#8a7a68,#d8c9ad)",by:"Sort, label and store the pictures that matter."}
];
const byId=id=>V.find(v=>v.id==id);
/* ---------- STATE (saved in this browser only) ---------- */
const S=Object.assign({user:false,autoplay:false,subs:["HG","PH","ST"],saved:[],history:[
 {id:1,when:"Today",note:"8 minutes left · Watched today at 10:24 AM",cta:"Continue"},
 {id:3,when:"Today",note:"Finished · Watched today at 8:40 AM",cta:"Continue"},
 {id:2,when:"Yesterday",note:"6 minutes left · Watched yesterday",cta:"Continue"},
 {id:4,when:"Yesterday",note:"Finished · Watched yesterday",cta:"Continue"},
 {id:8,when:"Yesterday",note:"12 minutes left · Watched yesterday",cta:"Continue"}]},
 (()=>{try{return JSON.parse(localStorage.gv||"{}")}catch(e){return{}}})());
const save=()=>{try{localStorage.gv=JSON.stringify(S)}catch(e){}};
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)};
/* ---------- PIECES ---------- */
const th=(v,play=true)=>`<div class="th" style="--g:${v.g}">${v.img?`<img src="${v.img}" alt="" loading="lazy">`:''}${play&&!v.baked?'<span class="play">▶</span>':''}${v.baked?'':`<span class="dur">${v.dur}</span>`}</div>`;
const card=v=>`<button class="vc" data-go="${v.id}">${th(v)}<div class="body"><h3>${v.t}</h3><small>${CH[v.ch].n}</small><small>${v.meta}</small></div></button>`;
const guest=()=>S.user?"":`<div class="guest"><span class="av">👤</span><p><b>You're browsing as a guest</b>Sign in to save your history and subscriptions, or keep watching without an account.</p><button class="btn sm" data-act="guest">Continue as guest</button><button class="btn red sm" data-act="signin">Sign in</button></div>`;
/* ---------- VIEWS ---------- */
function home(q){
 const list=V.filter(v=>v.id<=4&&(!q||(v.t+CH[v.ch].n).toLowerCase().includes(q)));
 return `<div class="hero"><div><div class="kicker">Today's good watching</div><h1>Take your time. You're in control.</h1><p>A calm collection of useful, interesting videos—chosen for quality, not clicks.</p></div>
 <div class="pick">${th({g:"#5f8a4f",img:"../images/cottage.jpg",dur:"14:00"},false)}<div><small>Editor's pick</small><b>A year in a cottage garden</b><small>14 minutes · Home & Garden</small></div></div></div>
 ${guest()}
 <section><div class="sh"><div><h2>Channels selected for you</h2><p>Clear, dependable programs from trusted creators.</p></div><button class="btn sm" data-act="chans">See all channels</button></div>
 <div class="channels">${Object.values(CH).map(c=>`<button class="ch"><span class="badge" style="background:${c.c}">${c.i}</span><span><b>${c.n}</b><small>${c.d}</small></span></button>`).join("")}</div></section>
 <section><div class="sh"><div><h2>Recommended for you</h2><p>Your considered suggestions. When you reach the end, you're all caught up.</p></div></div>
 ${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">No videos match “${q}”. Try a different word.</div>`}</section>
 <section class="end"><h3>You've reached the end of today's recommendations.</h3><p>Come back tomorrow for a fresh, thoughtfully sized selection.</p><button class="btn sm" data-r="#/library">Browse your Library</button></section>`;
}
function watch(id){
 const v=byId(id)||V[0],c=CH[v.ch],next=V.filter(x=>x.id!==v.id&&x.ch===v.ch||[5,6,7].includes(x.id)).filter(x=>x.id!==v.id).slice(0,3),sv=S.saved.includes(v.id);
 return `<div class="crumbs"><button class="btn sm" data-r="#/">‹ Back to Home</button><span>Now watching · ${c.n}</span></div>
 <div class="watch"><div><div class="player" style="--g:${v.g}"><span class="th" style="position:absolute;inset:0;background:none">${v.img?`<img src="${v.img}" alt="">`:""}<span class="play" id="pp"${v.baked?' style="opacity:0"':""}>▶</span></span><div class="ctrl"><div class="bar"><i id="prog"></i></div><span id="ptime">3:18 / ${v.dur}</span></div></div>
 <span class="tag">${c.n.toUpperCase()}</span><h1>${v.t}</h1>
 <div class="by"><span class="badge" style="background:${c.c}">${c.i}</span><span><b>${c.n}</b><small>${v.meta.split(" · ").join(" · ")}</small></span><button class="btn sm" data-save="${v.id}">${sv?"Saved ✓":"Save to library"}</button></div><p style="color:var(--mute)">${v.by}</p></div>
 <aside class="side"><div class="box toggle"><span>Autoplay is ${S.autoplay?"on":"off"}<small>Nothing plays unless you choose it.</small></span><button class="sw" data-act="auto" aria-pressed="${S.autoplay}" aria-label="Autoplay"></button></div>
 <div><b>Watch next</b><div style="color:var(--mute);font-size:12px;margin:2px 0 10px">Three related videos. Choose when you're ready.</div>${next.map(card).join("")}</div></aside></div>${guest()}`;
}
let tab="history";
function library(){
 const hist=S.history,days=[...new Set(hist.map(h=>h.when))];
 const body=tab==="history"?`<div class="sh"><div><h2 style="font-size:20px">Watch history on this device</h2><p>Newest first. Nothing is shared without your permission.</p></div><button class="btn sm" data-act="clear">Clear history</button></div>
  ${hist.length?days.map(d=>`<div class="day">${d}</div>`+hist.filter(h=>h.when===d).map(h=>{const v=byId(h.id);return `<div class="row"><div data-go="${v.id}">${th(v,false)}</div><div class="info">${v.t}<small>${CH[v.ch].n}</small><small>${h.note}</small></div><button class="btn sm" data-go="${v.id}">▷ Continue</button></div>`}).join("")).join(""):`<div class="empty">Nothing here yet. Videos you watch will appear on this device.</div>`}`
 :tab==="saved"?`<div class="sh"><h2 style="font-size:20px">Saved videos</h2></div>${S.saved.length?S.saved.map(i=>byId(i)).map(v=>`<div class="row"><div data-go="${v.id}">${th(v,false)}</div><div class="info">${v.t}<small>${CH[v.ch].n}</small></div><button class="btn sm" data-unsave="${v.id}">Remove</button></div>`).join(""):`<div class="empty">No saved videos. Use “Save to library” on any video.</div>`}`
 :`<div class="sh"><h2 style="font-size:20px">Subscriptions</h2></div><div class="grid" style="grid-template-columns:1fr">${Object.keys(CH).map(k=>subRow(k)).join("")}</div>`;
 return `<section style="margin-top:6px"><div class="sh"><div><small style="color:var(--red);font-weight:700">YOUR VIEWING, YOUR CHOICE</small><h1 style="font-size:30px">Library</h1><p>Return to what you watched, saved, or subscribed to—all in one clear place.</p></div>
 <div class="tabs">${[["history","Watch history"],["saved","Saved videos"],["subs","Subscriptions"]].map(([k,l])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}</div></div>
 ${guest()}<div class="lib"><div>${body}</div><aside><b>Your subscriptions</b><div style="color:var(--mute);font-size:12px;margin:2px 0 10px">Choose exactly which channels appear on Home.</div>${S.subs.map(subRow).join("")}
 <div class="note"><b>What does subscribing do?</b><br>New videos from these channels appear near the top of Home. We won't turn on autoplay or send emails you ask.</div></aside></div></section>`;
}
const subRow=k=>{const c=CH[k],on=S.subs.includes(k);return `<div class="sub"><span class="badge" style="background:${c.c}">${c.i}</span><span class="t">${c.n}<small>2 new videos each week</small></span><span class="pill">${on?"✓ Subscribed":"Not subscribed"}</span><button class="btn sm" data-sub="${k}">${on?"Manage":"Subscribe"}</button></div>`};
/* ---------- ROUTER + EVENTS ---------- */
const app=document.getElementById("app");
function render(){
 const [,r,id]=(location.hash||"#/").split("/"),q=document.getElementById("q").value.trim().toLowerCase();
 const route=r==="watch"?"watch":r==="library"?"library":"home";
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===route));
 document.getElementById("signin").textContent=S.user?"Sign out":"Sign in";
 app.innerHTML=route==="watch"?watch(id):route==="library"?library():home(q);
 document.title=(route==="watch"?(byId(id)||V[0]).t:route[0].toUpperCase()+route.slice(1))+" – GoodView · v2 – Real thumbnails";
}
addEventListener("hashchange",()=>{scrollTo(0,0);render()});
document.getElementById("q").addEventListener("input",()=>{if(location.hash&&location.hash!=="#/")location.hash="#/";else render()});
document.getElementById("signin").onclick=()=>{S.user=!S.user;save();toast(S.user?"Signed in (demo)":"Signed out");render()};
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-r],[data-act],[data-save],[data-unsave],[data-tab],[data-sub],#pp");if(!t)return;
 const d=t.dataset;
 if(t.id==="pp"){const p=document.getElementById("prog");t.textContent=t.textContent==="▶"?"❚❚":"▶";p.style.width=t.textContent==="❚❚"?"60%":"26%";return}
 if(d.go){location.hash="#/watch/"+d.go;return}
 if(d.r&&d.r[0]==="#"){location.hash=d.r;return}
 if(d.save){const i=+d.save;S.saved=S.saved.includes(i)?S.saved.filter(x=>x!==i):[...S.saved,i];save();toast(S.saved.includes(i)?"Saved to your library":"Removed from library");render()}
 if(d.unsave){S.saved=S.saved.filter(x=>x!==+d.unsave);save();render()}
 if(d.tab){tab=d.tab;render()}
 if(d.sub){const k=d.sub;S.subs=S.subs.includes(k)?S.subs.filter(x=>x!==k):[...S.subs,k];save();toast(S.subs.includes(k)?"Subscribed":"Unsubscribed");render()}
 if(d.act==="auto"){S.autoplay=!S.autoplay;save();render()}
 if(d.act==="clear"){S.history=[];save();toast("History cleared");render()}
 if(d.act==="signin"){S.user=true;save();toast("Signed in (demo)");render()}
 if(d.act==="guest"){S.user=false;toast("Continuing as a guest")}
 if(d.act==="chans")toast("All channels page: coming soon");
});
render();
</script>
</body>
</html>
